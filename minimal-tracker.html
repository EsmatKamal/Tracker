<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Tracker</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #0a0a0a;
            padding: 20px;
            min-height: 100vh;
        }
        
        .container {
            max-width: 400px;
            margin: 0 auto;
            background: #1a1a1a;
            border-radius: 8px;
            padding: 20px;
        }
        
        .header {
            text-align: center;
            margin-bottom: 25px;
        }
        
        .date {
            color: #fff;
            font-size: 20px;
            font-weight: 600;
            margin-bottom: 5px;
        }
        
        .streak {
            color: #667eea;
            font-size: 14px;
            font-weight: 600;
        }
        
        .section {
            margin-bottom: 25px;
        }
        
        .section-title {
            font-size: 12px;
            color: #666;
            text-transform: uppercase;
            font-weight: 600;
            margin-bottom: 12px;
            letter-spacing: 1px;
        }
        
        .item {
            display: flex;
            align-items: center;
            padding: 12px 0;
            border-bottom: 1px solid #2a2a2a;
            gap: 12px;
        }
        
        .item:last-child {
            border-bottom: none;
        }
        
        input[type="checkbox"] {
            width: 20px;
            height: 20px;
            cursor: pointer;
            accent-color: #667eea;
            flex-shrink: 0;
        }
        
        .label {
            flex: 1;
            color: #ddd;
            font-size: 14px;
            cursor: pointer;
            user-select: none;
        }
        
        input[type="checkbox"]:checked + .label {
            color: #666;
            text-decoration: line-through;
        }
        
        .delete-btn {
            background: none;
            border: none;
            color: #666;
            cursor: pointer;
            font-size: 12px;
            padding: 4px 8px;
        }
        
        .add-item {
            display: flex;
            gap: 8px;
            padding-top: 15px;
            border-top: 1px solid #2a2a2a;
        }
        
        input[type="text"] {
            flex: 1;
            padding: 10px;
            background: #2a2a2a;
            border: 1px solid #333;
            border-radius: 4px;
            color: #fff;
            font-size: 13px;
        }
        
        input[type="text"]:focus {
            outline: none;
            border-color: #667eea;
        }
        
        .btn-add {
            padding: 10px 15px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
            font-weight: 600;
        }
        
        .stats {
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 1px solid #2a2a2a;
        }
        
        .stat {
            flex: 1;
            text-align: center;
        }
        
        .stat-num {
            font-size: 18px;
            font-weight: 700;
            color: #667eea;
        }
        
        .stat-label {
            font-size: 11px;
            color: #666;
            margin-top: 4px;
        }
        
        .footer {
            margin-top: 25px;
            padding-top: 15px;
            border-top: 1px solid #2a2a2a;
            text-align: center;
        }
        
        button {
            background: #333;
            color: #888;
            border: none;
            padding: 8px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 11px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="date" id="dateDisplay"></div>
            <div class="streak" id="streakDisplay">Streak: 0 days</div>
        </div>
        
        <div class="stats">
            <div class="stat">
                <div class="stat-num" id="completed">0</div>
                <div class="stat-label">Done</div>
            </div>
            <div class="stat">
                <div class="stat-num" id="total">0</div>
                <div class="stat-label">Total</div>
            </div>
        </div>
        
        <div class="section">
            <div class="section-title">Core</div>
            <div id="coreItems"></div>
            <div class="add-item">
                <input type="text" placeholder="Add item..." id="newItemCore" autocomplete="off">
                <button class="btn-add" onclick="addCoreItem()">Add</button>
            </div>
        </div>
        
        <div class="section">
            <div class="section-title">Daily Habits</div>
            <div id="habitItems"></div>
            <div class="add-item">
                <input type="text" placeholder="Add habit..." id="newItemHabit" autocomplete="off">
                <button class="btn-add" onclick="addHabitItem()">Add</button>
            </div>
        </div>
        
        <div class="footer">
            <button onclick="resetDay()">Reset for Tomorrow</button>
        </div>
    </div>
    
    <script>
        let data = {
            date: new Date().toISOString().split('T')[0],
            coreItems: [
                { id: 1, name: 'No Instagram' },
                { id: 2, name: 'No PMO' },
                { id: 3, name: 'Gym' },
                { id: 4, name: 'Prayer (Fajr)' },
                { id: 5, name: 'Prayer (Evening)' },
                { id: 6, name: 'Cook' }
            ],
            habitItems: [],
            coreCompleted: [],
            habitCompleted: [],
            startDate: new Date().toISOString().split('T')[0]
        };
        
        function initData() {
            const saved = localStorage.getItem('minimalTrackerData');
            if (saved) {
                data = JSON.parse(saved);
                const today = new Date().toISOString().split('T')[0];
                if (data.date !== today) {
                    data.date = today;
                    data.coreCompleted = [];
                    data.habitCompleted = [];
                }
            }
            saveData();
        }
        
        function saveData() {
            localStorage.setItem('minimalTrackerData', JSON.stringify(data));
            render();
        }
        
        function addCoreItem() {
            const input = document.getElementById('newItemCore');
            const value = input.value.trim();
            if (!value) return;
            const id = Math.max(...data.coreItems.map(i => i.id), 0) + 1;
            data.coreItems.push({ id, name: value });
            input.value = '';
            saveData();
        }
        
        function addHabitItem() {
            const input = document.getElementById('newItemHabit');
            const value = input.value.trim();
            if (!value) return;
            const id = Math.max(...data.habitItems.map(i => i.id), 0) + 1;
            data.habitItems.push({ id, name: value });
            input.value = '';
            saveData();
        }
        
        function toggleCore(id) {
            if (data.coreCompleted.includes(id)) {
                data.coreCompleted = data.coreCompleted.filter(c => c !== id);
            } else {
                data.coreCompleted.push(id);
            }
            saveData();
        }
        
        function toggleHabit(id) {
            if (data.habitCompleted.includes(id)) {
                data.habitCompleted = data.habitCompleted.filter(c => c !== id);
            } else {
                data.habitCompleted.push(id);
            }
            saveData();
        }
        
        function deleteCore(id) {
            data.coreItems = data.coreItems.filter(i => i.id !== id);
            data.coreCompleted = data.coreCompleted.filter(c => c !== id);
            saveData();
        }
        
        function deleteHabit(id) {
            data.habitItems = data.habitItems.filter(i => i.id !== id);
            data.habitCompleted = data.habitCompleted.filter(c => c !== id);
            saveData();
        }
        
        function resetDay() {
            data.coreCompleted = [];
            data.habitCompleted = [];
            saveData();
        }
        
        function calculateStreak() {
            return Math.floor((new Date(data.date) - new Date(data.startDate)) / (1000 * 60 * 60 * 24));
        }
        
        function render() {
            const today = new Date();
            const options = { month: 'short', day: 'numeric' };
            document.getElementById('dateDisplay').textContent = today.toLocaleDateString('en-US', options);
            document.getElementById('streakDisplay').textContent = `Streak: ${calculateStreak()} days`;
            
            let coreHtml = '';
            data.coreItems.forEach(item => {
                const checked = data.coreCompleted.includes(item.id);
                coreHtml += `
                    <div class="item">
                        <input type="checkbox" ${checked ? 'checked' : ''} onchange="toggleCore(${item.id})">
                        <label class="label" onclick="toggleCore(${item.id})">${item.name}</label>
                        <button class="delete-btn" onclick="deleteCore(${item.id})">×</button>
                    </div>
                `;
            });
            document.getElementById('coreItems').innerHTML = coreHtml;
            
            let habitHtml = '';
            data.habitItems.forEach(item => {
                const checked = data.habitCompleted.includes(item.id);
                habitHtml += `
                    <div class="item">
                        <input type="checkbox" ${checked ? 'checked' : ''} onchange="toggleHabit(${item.id})">
                        <label class="label" onclick="toggleHabit(${item.id})">${item.name}</label>
                        <button class="delete-btn" onclick="deleteHabit(${item.id})">×</button>
                    </div>
                `;
            });
            document.getElementById('habitItems').innerHTML = habitHtml || '<div style="color: #555; font-size: 13px; padding: 10px 0;">Add habits to track</div>';
            
            const total = data.coreItems.length + data.habitItems.length;
            const completed = data.coreCompleted.length + data.habitCompleted.length;
            document.getElementById('completed').textContent = completed;
            document.getElementById('total').textContent = total;
        }
        
        document.getElementById('newItemCore').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') addCoreItem();
        });
        
        document.getElementById('newItemHabit').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') addHabitItem();
        });
        
        initData();
    </script>
</body>
</html>
