<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Calendar Tracker</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 20px;
            min-height: 100vh;
        }
        
        .container {
            max-width: 500px;
            margin: 0 auto;
            background: white;
            border-radius: 12px;
            padding: 25px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }
        
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
        }
        
        .header h1 {
            font-size: 24px;
            color: #333;
        }
        
        .nav-btn {
            background: #667eea;
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            font-size: 14px;
            transition: background 0.2s;
        }
        
        .nav-btn:hover {
            background: #5568d3;
        }
        
        .nav-btn:disabled {
            background: #ccc;
            cursor: not-allowed;
        }
        
        .date-display {
            text-align: center;
            font-size: 16px;
            color: #666;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 2px solid #f0f0f0;
        }
        
        .date-display .day {
            font-weight: 600;
            color: #333;
            font-size: 18px;
        }
        
        .date-display .relative {
            font-size: 13px;
            color: #999;
            margin-top: 4px;
        }
        
        .stats {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
            background: #f5f7ff;
            padding: 15px;
            border-radius: 8px;
            font-size: 13px;
        }
        
        .stat {
            flex: 1;
            text-align: center;
        }
        
        .stat-number {
            font-size: 18px;
            font-weight: 700;
            color: #667eea;
        }
        
        .stat-label {
            color: #999;
            margin-top: 4px;
        }
        
        .input-group {
            display: flex;
            gap: 8px;
            margin-bottom: 20px;
        }
        
        input[type="text"] {
            flex: 1;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 6px;
            font-size: 14px;
            transition: border-color 0.2s;
        }
        
        input[type="text"]:focus {
            outline: none;
            border-color: #667eea;
        }
        
        .btn-add {
            padding: 12px 18px;
            background: #4CAF50;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            font-size: 14px;
            transition: background 0.2s;
        }
        
        .btn-add:hover {
            background: #45a049;
        }
        
        .section-title {
            font-size: 13px;
            font-weight: 600;
            color: #999;
            text-transform: uppercase;
            margin-bottom: 12px;
            margin-top: 18px;
        }
        
        .section-title:first-of-type {
            margin-top: 0;
        }
        
        .item {
            display: flex;
            align-items: center;
            padding: 10px 0;
            border-bottom: 1px solid #f5f5f5;
            gap: 10px;
        }
        
        .item:last-child {
            border-bottom: none;
        }
        
        input[type="checkbox"] {
            width: 18px;
            height: 18px;
            cursor: pointer;
            accent-color: #667eea;
            flex-shrink: 0;
        }
        
        .item-label {
            flex: 1;
            cursor: pointer;
            color: #333;
            font-size: 14px;
            user-select: none;
        }
        
        input[type="checkbox"]:checked + .item-label {
            color: #bbb;
            text-decoration: line-through;
        }
        
        .item-actions {
            display: flex;
            gap: 6px;
        }
        
        .btn-small {
            padding: 4px 10px;
            font-size: 12px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            background: #f0f0f0;
            color: #666;
            transition: all 0.2s;
        }
        
        .btn-small:hover {
            background: #e0e0e0;
        }
        
        .btn-delete {
            background: #ffebee;
            color: #c62828;
        }
        
        .btn-delete:hover {
            background: #ffcdd2;
        }
        
        .empty {
            text-align: center;
            color: #ccc;
            padding: 20px;
            font-size: 14px;
        }
        
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.5);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }
        
        .modal.active {
            display: flex;
        }
        
        .modal-content {
            background: white;
            padding: 25px;
            border-radius: 12px;
            max-width: 400px;
            width: 90%;
        }
        
        .modal-content h2 {
            font-size: 18px;
            margin-bottom: 15px;
            color: #333;
        }
        
        .modal-input {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 6px;
            font-size: 14px;
            margin-bottom: 15px;
        }
        
        .modal-buttons {
            display: flex;
            gap: 10px;
        }
        
        .modal-buttons button {
            flex: 1;
            padding: 10px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            font-size: 14px;
        }
        
        .modal-save {
            background: #667eea;
            color: white;
        }
        
        .modal-cancel {
            background: #f0f0f0;
            color: #666;
        }
        
        .recurring-note {
            font-size: 12px;
            color: #999;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 1px solid #f0f0f0;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Tracker</h1>
            <div style="display: flex; gap: 8px;">
                <button class="nav-btn" onclick="previousDay()">← Prev</button>
                <button class="nav-btn" onclick="nextDay()">Next →</button>
            </div>
        </div>
        
        <div class="date-display">
            <div class="day" id="dateDisplay"></div>
            <div class="relative" id="relativeDate"></div>
        </div>
        
        <div class="stats">
            <div class="stat">
                <div class="stat-number" id="completed">0</div>
                <div class="stat-label">Completed</div>
            </div>
            <div class="stat">
                <div class="stat-number" id="total">0</div>
                <div class="stat-label">Total</div>
            </div>
        </div>
        
        <div class="input-group">
            <input type="text" id="newItem" placeholder="Add task for today..." autocomplete="off">
            <button class="btn-add" onclick="addTaskForDay()">Add</button>
        </div>
        
        <div class="recurring-note">Daily habits repeat each day. Custom tasks only appear on the day you add them.</div>
        
        <div class="section-title">Daily Habits (Repeating)</div>
        <div id="recurringItems"></div>
        
        <div class="section-title">Today's Tasks</div>
        <div id="customItems"></div>
    </div>
    
    <div class="modal" id="editModal">
        <div class="modal-content">
            <h2>Edit Item</h2>
            <input type="text" id="editInput" class="modal-input" placeholder="Item name...">
            <div class="modal-buttons">
                <button class="modal-save" onclick="saveEdit()">Save</button>
                <button class="modal-cancel" onclick="closeEdit()">Cancel</button>
            </div>
        </div>
    </div>
    
    <script>
        let data = {
            recurring: [],
            customTasks: {}, // { "2025-01-15": [{id, name}] }
            completed: {} // { "2025-01-15": [id1, id2] }
        };
        
        let currentDate = new Date();
        let editingId = null;
        let editingType = null;
        
        const defaultRecurring = [
            'No social media',
            'No PMO (porn/masturbation)',
            'Gym or physical activity',
            'Study (math/CAE/readings)',
            'Cook something',
            'Library or quiet time'
        ];
        
        function formatDate(date) {
            return date.toISOString().split('T')[0];
        }
        
        function initData() {
            const saved = localStorage.getItem('calendarTrackerData');
            if (saved) {
                data = JSON.parse(saved);
            } else {
                data.recurring = defaultRecurring.map((item, idx) => ({
                    id: idx,
                    name: item
                }));
                saveData();
            }
        }
        
        function saveData() {
            localStorage.setItem('calendarTrackerData', JSON.stringify(data));
            render();
        }
        
        function getDateKey() {
            return formatDate(currentDate);
        }
        
        function getCompletedForDate() {
            const key = getDateKey();
            return data.completed[key] || [];
        }
        
        function setCompletedForDate(completed) {
            const key = getDateKey();
            data.completed[key] = completed;
            saveData();
        }
        
        function getCustomTasksForDate() {
            const key = getDateKey();
            return data.customTasks[key] || [];
        }
        
        function setCustomTasksForDate(tasks) {
            const key = getDateKey();
            data.customTasks[key] = tasks;
            saveData();
        }
        
        function previousDay() {
            currentDate.setDate(currentDate.getDate() - 1);
            render();
        }
        
        function nextDay() {
            currentDate.setDate(currentDate.getDate() + 1);
            render();
        }
        
        function addTaskForDay() {
            const input = document.getElementById('newItem');
            const value = input.value.trim();
            if (!value) return;
            
            const customTasks = getCustomTasksForDate();
            const newId = Math.max(...customTasks.map(t => t.id), -1) + 1;
            customTasks.push({ id: newId, name: value });
            setCustomTasksForDate(customTasks);
            input.value = '';
        }
        
        function deleteTask(id, type) {
            if (type === 'recurring') {
                data.recurring = data.recurring.filter(i => i.id !== id);
                // Remove from all completed dates
                Object.keys(data.completed).forEach(key => {
                    data.completed[key] = data.completed[key].filter(c => c !== id);
                });
            } else {
                const customTasks = getCustomTasksForDate();
                setCustomTasksForDate(customTasks.filter(t => t.id !== id));
                // Remove from completed
                const completed = getCompletedForDate();
                setCompletedForDate(completed.filter(c => c !== id));
            }
            saveData();
        }
        
        function openEdit(id, type) {
            editingId = id;
            editingType = type;
            
            let item;
            if (type === 'recurring') {
                item = data.recurring.find(i => i.id === id);
            } else {
                item = getCustomTasksForDate().find(t => t.id === id);
            }
            
            if (!item) return;
            document.getElementById('editInput').value = item.name;
            document.getElementById('editModal').classList.add('active');
            document.getElementById('editInput').focus();
        }
        
        function closeEdit() {
            document.getElementById('editModal').classList.remove('active');
            editingId = null;
            editingType = null;
        }
        
        function saveEdit() {
            const newName = document.getElementById('editInput').value.trim();
            if (!newName) return;
            
            if (editingType === 'recurring') {
                const item = data.recurring.find(i => i.id === editingId);
                if (item) item.name = newName;
            } else {
                const customTasks = getCustomTasksForDate();
                const item = customTasks.find(t => t.id === editingId);
                if (item) item.name = newName;
                setCustomTasksForDate(customTasks);
            }
            saveData();
            closeEdit();
        }
        
        function toggleItem(id) {
            let completed = getCompletedForDate();
            if (completed.includes(id)) {
                completed = completed.filter(c => c !== id);
            } else {
                completed.push(id);
            }
            setCompletedForDate(completed);
        }
        
        function updateDateDisplay() {
            const options = { weekday: 'long', month: 'short', day: 'numeric', year: 'numeric' };
            document.getElementById('dateDisplay').textContent = currentDate.toLocaleDateString('en-US', options);
            
            // Relative date
            const today = new Date();
            today.setHours(0, 0, 0, 0);
            const current = new Date(currentDate);
            current.setHours(0, 0, 0, 0);
            
            const diff = Math.floor((current - today) / (1000 * 60 * 60 * 24));
            let relative = '';
            if (diff === 0) relative = 'Today';
            else if (diff === 1) relative = 'Tomorrow';
            else if (diff === -1) relative = 'Yesterday';
            else if (diff > 1) relative = `In ${diff} days`;
            else if (diff < -1) relative = `${Math.abs(diff)} days ago`;
            
            document.getElementById('relativeDate').textContent = relative;
        }
        
        function render() {
            updateDateDisplay();
            
            const completed = getCompletedForDate();
            const recurring = data.recurring;
            const customTasks = getCustomTasksForDate();
            
            // Render recurring items
            let recurringHtml = '';
            if (recurring.length === 0) {
                recurringHtml = '<div class="empty">No recurring items</div>';
            } else {
                recurring.forEach(item => {
                    const isChecked = completed.includes(item.id);
                    recurringHtml += `
                        <div class="item">
                            <input type="checkbox" ${isChecked ? 'checked' : ''} 
                                onchange="toggleItem(${item.id})">
                            <label class="item-label" onclick="toggleItem(${item.id})">${item.name}</label>
                            <div class="item-actions">
                                <button class="btn-small" onclick="openEdit(${item.id}, 'recurring')">Edit</button>
                                <button class="btn-small btn-delete" onclick="deleteTask(${item.id}, 'recurring')">Delete</button>
                            </div>
                        </div>
                    `;
                });
            }
            document.getElementById('recurringItems').innerHTML = recurringHtml;
            
            // Render custom tasks
            let customHtml = '';
            if (customTasks.length === 0) {
                customHtml = '<div class="empty">No custom tasks for this day yet</div>';
            } else {
                customTasks.forEach(task => {
                    const isChecked = completed.includes(task.id);
                    customHtml += `
                        <div class="item">
                            <input type="checkbox" ${isChecked ? 'checked' : ''} 
                                onchange="toggleItem(${task.id})">
                            <label class="item-label" onclick="toggleItem(${task.id})">${task.name}</label>
                            <div class="item-actions">
                                <button class="btn-small" onclick="openEdit(${task.id}, 'custom')">Edit</button>
                                <button class="btn-small btn-delete" onclick="deleteTask(${task.id}, 'custom')">Delete</button>
                            </div>
                        </div>
                    `;
                });
            }
            document.getElementById('customItems').innerHTML = customHtml;
            
            // Update stats
            const total = recurring.length + customTasks.length;
            const completedCount = completed.length;
            document.getElementById('completed').textContent = completedCount;
            document.getElementById('total').textContent = total;
        }
        
        document.getElementById('newItem').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') addTaskForDay();
        });
        
        document.getElementById('editInput').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') saveEdit();
        });
        
        document.getElementById('editModal').addEventListener('click', (e) => {
            if (e.target.id === 'editModal') closeEdit();
        });
        
        initData();
    </script>
</body>
</html>
